title: Zifeng Weng
url: https://wengzf20.github.io
baseurl: ""
lang: en
description: Zifeng Weng — computational fluid dynamics, combustion, and energy research.
email: zfweng98@gmail.com
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
permalink: /blog/:year/:title/
include: [_pages]
exclude: [archive, vendor, node_modules, Gemfile, Gemfile.lock, README.md, LICENSE, scripts, .bundle]
collections:
  news:
    output: true
    permalink: /news/:path/
  projects:
    output: true
    permalink: /projects/:path/
plugins:
  - jekyll/scholar
  - jekyll-archives
  - jekyll-feed
  - jekyll-sitemap
jekyll-archives:
  enabled: [year, tags, categories]
  layouts:
    year: post-archive
    tag: post-archive
    category: post-archive
  permalinks:
    year: /blog/:year/
    tag: /blog/tag/:name/
    category: /blog/category/:name/
scholar:
  style: apa
  locale: en
  source: ./_bibliography
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  query: "@*"
  group_by: year
  group_order: descending
defaults:
  - scope:
      path: assets
    values:
      sitemap: false
